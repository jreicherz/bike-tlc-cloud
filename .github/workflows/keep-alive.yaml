name: Supabase Keep-Alive

on:
  schedule:
    # Läuft automatisch jeden Montag und Donnerstag um 08:00 Uhr UTC
    - cron: '0 8 * * 1,4'
  workflow_dispatch: # Erlaubt das manuelle Starten per Klick im Reiter "Actions"

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Fehler: SUPABASE_URL oder SUPABASE_KEY Secret fehlt in GitHub!"
            exit 1
          fi
          curl -s -f -X GET "${SUPABASE_URL}/rest/v1/bike_app_state?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}"
          echo "Supabase erfolgreich angepingt!"