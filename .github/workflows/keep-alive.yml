name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 10 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets sicher prüfen (ohne Klartext)
        env:
          URL_VAL: ${{ secrets.SUPABASE_URL }}
          KEY_VAL: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Länge SUPABASE_URL: ${#URL_VAL}"
          echo "Länge SUPABASE_ANON_KEY: ${#KEY_VAL}"
          
          if [[ "$URL_VAL" == https://*.supabase.co ]]; then
            echo "URL-Format: OK (beginnt mit https:// und endet auf .supabase.co)"
          else
            echo "URL-Format: FEHLER! Prüfe https://, Leerzeichen oder Schrägstrich am Ende."
          fi

      - name: Ping Supabase REST API
        run: curl --fail --silent --show-error --output /dev/null -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" "${{ secrets.SUPABASE_URL }}/rest/v1/"
