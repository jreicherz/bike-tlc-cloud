name: Supabase Keep-Alive & Komoot Sync

on:
  schedule:
    # Läuft täglich um 19:00 Uhr UTC (20:00 Uhr deutscher Winterzeit / 21:00 Uhr Sommerzeit)
    - cron: '0 19 * * *'
  workflow_dispatch: # Erlaubt jederzeit das manuelle Starten per Klick im Reiter "Actions"

jobs:
  sync-komoot-and-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Komoot Touren abrufen & in Supabase speichern
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          KOMOOT_EMAIL: ${{ secrets.KOMOOT_EMAIL }}
          KOMOOT_PASSWORD: ${{ secrets.KOMOOT_PASSWORD }}
        run: |
          python3 - << 'EOF'
          import os, sys, json, urllib.request, base64

          sb_url = os.environ.get("SUPABASE_URL", "").rstrip("/")
          sb_key = os.environ.get("SUPABASE_KEY", "")
          k_email = os.environ.get("KOMOOT_EMAIL", "")
          k_pass = os.environ.get("KOMOOT_PASSWORD", "")

          if not sb_url or not sb_key:
              print("Fehler: SUPABASE_URL oder SUPABASE_KEY fehlt in den GitHub Secrets!")
              sys.exit(1)

          sb_headers = {
              "apikey": sb_key,
              "Authorization": f"Bearer {sb_key}",
              "Content-Type": "application/json"
          }

          # 1. Aktuellen App-Stand aus Supabase abrufen (wirkt gleichzeitig als Keep-Alive Ping)
          req = urllib.request.Request(f"{sb_url}/rest/v1/bike_app_state?id=eq.1&select=payload", headers=sb_headers)
          with urllib.request.urlopen(req) as resp:
              rows = json.loads(resp.read().decode("utf-8"))

          payload = rows[0].get("payload", {}) if rows and isinstance(rows[0].get("payload"), dict) else {}

          # Falls noch keine Komoot-Daten hinterlegt sind, reicht der Keep-Alive Ping
          if not k_email or not k_pass:
              print("Supabase erfolgreich angepingt (Komoot-Secrets noch nicht gesetzt).")
              sys.exit(0)

          # 2. Bei Komoot einloggen und User-ID ermitteln
          auth_str = base64.b64encode(f"{k_email}:{k_pass}".encode("utf-8")).decode("utf-8")
          k_headers = {
              "Authorization": f"Basic {auth_str}",
              "Accept": "application/hal+json,application/json",
              "User-Agent": "BikeTLCPro-Sync/1.0"
          }

          req_login = urllib.request.Request("https://api.komoot.de/v006/account/email/" + urllib.parse.quote(k_email) + "/", headers=k_headers)
          with urllib.request.urlopen(req_login) as resp:
              account_data = json.loads(resp.read().decode("utf-8"))
              user_id = account_data.get("username")

          if not user_id:
              print("Konnte Komoot User-ID nicht ermitteln.")
              sys.exit(1)

          # 3. Aufgezeichnete Touren (tour_recorded) abrufen
          tours_url = f"https://api.komoot.de/v007/users/{user_id}/tours/?type=tour_recorded&sort_field=date&sort_direction=desc&limit=20"
          req_tours = urllib.request.Request(tours_url, headers=k_headers)
          with urllib.request.urlopen(req_tours) as resp:
              tours_data = json.loads(resp.read().decode("utf-8"))

          raw_tours = tours_data.get("_embedded", {}).get("tours", [])
          komoot_inbox = []

          for t in raw_tours:
              dist_m = float(t.get("distance", 0))
              dur_s = float(t.get("time_in_motion", t.get("duration", 0)))
              elev_up = round(float(t.get("elevation_up", 0)))
              date_iso = str(t.get("date", ""))[:10]
              komoot_inbox.append({
                  "komootId": str(t.get("id")),
                  "date": date_iso,
                  "name": t.get("name", "Komoot Tour"),
                  "km": round(dist_m / 1000.0, 1),
                  "hm": elev_up,
                  "durationSec": round(dur_s),
                  "sport": t.get("sport", "")
              })

          # 4. komootInbox im Payload aktualisieren und in Supabase speichern
          payload["komootInbox"] = komoot_inbox
          payload["komootLastSync"] = __import__("datetime").datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")

          update_body = json.dumps({
              "id": 1,
              "payload": payload,
              "updated_at": __import__("datetime").datetime.utcnow().isoformat() + "Z"
          }).encode("utf-8")

          sb_headers["Prefer"] = "resolution=merge-duplicates"
          req_save = urllib.request.Request(f"{sb_url}/rest/v1/bike_app_state", data=update_body, headers=sb_headers, method="POST")
          with urllib.request.urlopen(req_save) as resp:
              pass

          print(f"Erfolg! {len(komoot_inbox)} aufgezeichnete Komoot-Touren in Supabase synchronisiert.")
          EOF